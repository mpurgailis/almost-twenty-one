name: Apply Kobra rebuild
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository contents
        run: |
          mkdir /tmp/rebuild
          tar -xzf almost-twenty-one-kobra-source-eb326461.tgz -C /tmp/rebuild
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rebuild/. .
          git config user.name "mpurgailis"
          git config user.email "mpurgailis@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild with genuine Kobra and shadcn components"
          git push
